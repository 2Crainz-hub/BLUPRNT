<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUPRNT — Product Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0A0A0C;
    --coral:#FF5C5C;--coral-deep:#E84F4F;
    --teal:#34D9C0;--teal-deep:#2BC0AA;
    --glass:rgba(70,79,94,.50);--glass-2:rgba(86,96,112,.55);--glass-sub:rgba(255,255,255,.06);
    --bdr:rgba(255,255,255,.10);--bdr-2:rgba(255,255,255,.16);
    --txt:#FFFFFF;--txt-2:#AEB4BE;--txt-3:#79818C;
    --steam:#FFB35C;
    --val:#34D9C0;--suspect:#FF5C5C;
    --k:#6BA8FF;--p:#B98CFF;--b:#FFB35C;--fd:#FF9F57;--pin:#FFCB7A;--mgm:#5FD08A;--czr:#E58FB5;
    --mut:#79818C;--mut-2:#AEB4BE;--line-soft:rgba(255,255,255,.07);
    --blur:blur(30px) saturate(125%);
    --rad:22px;--rad-lg:26px;--rad-sm:14px;
    --gl-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 24px 60px -34px rgba(0,0,0,.85);
  }
  body{background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;position:relative;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;filter:blur(30px);
    background:
      radial-gradient(620px 520px at 60% 8%, rgba(255,92,92,.16), transparent 60%),
      radial-gradient(560px 520px at 12% 42%, rgba(52,217,192,.10), transparent 62%),
      radial-gradient(680px 600px at 88% 88%, rgba(255,92,92,.10), transparent 62%);}
  .mono{font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px}

  /* shell */
  .app{display:flex;min-height:100vh;position:relative;z-index:1}
  .sidebar{width:252px;flex-shrink:0;padding:22px 15px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--bdr)}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px}
  .brand svg{width:26px;height:26px}
  .brand .nm{font-weight:800;letter-spacing:.06em;font-size:17px;color:var(--txt)}
  .navlbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3);padding:12px 8px 6px}
  .nav{display:flex;flex-direction:column;gap:5px}
  .navitem{position:relative;display:flex;align-items:center;gap:12px;padding:11px;border-radius:16px;cursor:pointer;border:1px solid transparent;transition:background .14s,border-color .14s}
  .navitem:hover{background:rgba(255,255,255,.05)}
  .navitem.on{background:rgba(52,217,192,.13);border-color:rgba(52,217,192,.4)}
  .navitem .ico{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--bdr);font-size:14px;font-weight:700;color:var(--txt-2)}
  .navitem.on .ico{background:rgba(52,217,192,.18);border-color:rgba(52,217,192,.45);color:var(--teal)}
  .navitem .nm{font-weight:700;font-size:14.5px;color:var(--txt)}
  .navitem .ds{font-size:11px;font-weight:500;color:var(--txt-3);margin-top:1px}
  .navitem .tag{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.05em;color:#0A0A0C;background:var(--coral);border-radius:6px;padding:3px 6px}
  .navitem.soon{opacity:.72}
  .tag.soon{background:var(--txt-3)}
  .railitem.soon{opacity:.72;position:relative}
  .soon-banner{background:rgba(232,197,90,.1);border:1px solid rgba(232,197,90,.35);color:#E8C55A;border-radius:12px;padding:13px 17px;font-size:13px;font-weight:600;margin-bottom:18px;line-height:1.5}
  .navitem.locked{opacity:.62}
  .tag.lock{background:none;padding:0;font-size:13px}
  .freebar{background:rgba(52,217,192,.08);border:1px solid rgba(52,217,192,.3);border-radius:12px;padding:13px 17px;font-size:13px;color:var(--txt-2);margin-bottom:16px;line-height:1.5}
  .board-note{font-size:12px;color:var(--txt-3);text-align:center;padding:16px 4px 4px}
  .freebar a{color:var(--teal);font-weight:700;text-decoration:none}
  .paywall{padding:52px 28px;text-align:center;max-width:460px;margin:0 auto}
  .paywall .pw-lock{font-size:34px;margin-bottom:16px}
  .paywall h3{font-size:21px;font-weight:800;margin-bottom:12px;color:var(--txt)}
  .paywall p{color:var(--txt-2);line-height:1.55;margin:0 0 8px}
  .paywall .pw-price{color:var(--txt);font-weight:700;margin:16px 0 22px;font-size:15px}
  .paywall .pw-btn{background:var(--teal);color:#0A0A0C;border:none;border-radius:12px;padding:13px 30px;font-weight:800;font-size:14px;cursor:pointer}
  .paywall .pw-btn:hover{opacity:.9}
  .rsoon{position:absolute;top:3px;right:8px;font-size:7px;font-weight:800;letter-spacing:.03em;color:var(--txt-3)}
  .side-foot{margin-top:auto;border-top:1px solid var(--bdr);padding-top:15px;display:flex;align-items:center;gap:11px}
  .side-foot .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--teal));flex-shrink:0;border:2px solid rgba(255,255,255,.14)}
  .side-foot .who{font-size:13.5px;font-weight:700;color:var(--txt)}
  .side-foot .plan{font-size:10.5px;font-weight:600;color:var(--teal)}
  .side-links{display:flex;flex-wrap:wrap;gap:4px 8px;padding:12px 2px 2px;font-size:11px;align-items:center}
  .side-links a{color:var(--txt-3);text-decoration:none;font-weight:600}
  .side-links a:hover{color:var(--teal)}
  .side-links span{color:var(--txt-3);opacity:.45}
  .main{flex:1;min-width:0;padding:clamp(20px,3vw,40px) clamp(20px,3.4vw,48px) 64px}

  /* topbar */
  .topbar{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:28px}
  .topbar .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);display:flex;align-items:center;gap:9px}
  .topbar h1{font-weight:800;letter-spacing:-.02em;font-size:clamp(28px,4.4vw,42px);margin-top:8px;line-height:1.0;color:var(--txt)}
  .topbar .sub{color:var(--txt-2);font-size:14px;margin-top:8px;max-width:62ch}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{font-size:12px;font-weight:700;border:1px solid var(--bdr-2);border-radius:999px;padding:9px 16px;color:var(--txt-2);display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);cursor:pointer}
  .pill.on{border-color:rgba(52,217,192,.5);color:var(--teal);background:rgba(52,217,192,.12)}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--teal)}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .view{display:none;animation:fade .3s ease}.view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* generic frosted panel */
  .grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
  .panel{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--bdr);border-radius:var(--rad);overflow:hidden;box-shadow:var(--gl-shadow)}
  .phead{display:flex;align-items:center;justify-content:space-between;padding:17px 21px;border-bottom:1px solid var(--bdr)}
  .phead h3{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-2)}
  .phead .meta{font-size:11.5px;font-weight:600;color:var(--txt-3);font-variant-numeric:tabular-nums}
  .pright{display:flex;align-items:center;gap:12px}
  .daytog{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:10px;padding:3px}
  .daytog .dt{font-size:11.5px;font-weight:700;color:var(--txt-3);background:none;border:none;border-radius:7px;padding:6px 13px;cursor:pointer;transition:background .12s,color .12s}
  .daytog .dt.on{background:var(--teal);color:#0A0A0C}
  .info{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:1px solid var(--bdr-2);color:var(--txt-3);font-size:11px;font-weight:800;font-style:normal;cursor:help;position:relative;flex:0 0 auto}
  .info:hover{color:var(--txt);border-color:var(--txt-3)}
  .info:hover::after{content:attr(data-tip);position:absolute;top:26px;right:0;width:290px;background:#15161A;border:1px solid var(--bdr);border-radius:11px;padding:13px 15px;font-size:12px;font-weight:500;line-height:1.55;color:var(--txt-2);letter-spacing:0;text-transform:none;z-index:60;box-shadow:0 12px 34px rgba(0,0,0,.55);text-align:left;white-space:normal}

  /* === ARB = teal-highlighted frosted hero (Daily-Goal pattern) === */
  .arb{position:relative;background:linear-gradient(135deg,rgba(52,217,192,.16),var(--glass) 60%);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(52,217,192,.5);border-radius:var(--rad-lg);overflow:hidden;margin-bottom:22px;box-shadow:0 0 50px -26px rgba(52,217,192,.5),var(--gl-shadow)}
  .arb-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.1);flex-wrap:wrap}
  .arb-head .lock{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px}
  .arb-head .lock b{font-size:17px}
  .arb-head .ttl{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--txt)}
  .arb-head .ex{color:var(--txt-2);font-size:13px;font-weight:500;max-width:47ch}
  .arb-head .calc{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--txt-2)}
  .arb-head .calc input{width:96px;background:rgba(255,255,255,.08);border:1px solid var(--bdr-2);color:var(--txt);font-weight:800;font-size:16px;padding:8px 11px;border-radius:12px;text-align:right;font-variant-numeric:tabular-nums}
  .arb-head .calc input:focus{outline:none;border-color:var(--teal)}
  .arb-body{padding:8px 14px 16px}
  .arbcard{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:14px;align-items:center;padding:15px 9px;border-bottom:1px solid var(--line-soft)}
  .arbcard:last-child{border-bottom:0}
  .arbcard .match{font-weight:800;font-size:16px;color:var(--txt)}
  .arbcard .match .t{font-size:11px;color:var(--txt-3);font-weight:500;margin-top:3px}
  .leg{background:var(--glass-sub);border:1px solid var(--bdr);border-radius:14px;padding:11px 13px}
  .leg .side{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;color:var(--txt)}
  .leg .ven{font-size:11px;color:var(--txt-3);font-weight:600;margin-top:4px;display:flex;justify-content:space-between}
  .leg .stake{font-size:13px;color:var(--txt-2);font-weight:600;margin-top:8px;border-top:1px solid var(--bdr);padding-top:7px;font-variant-numeric:tabular-nums}
  .leg .stake b{color:var(--teal);font-weight:800}
  .arbcard .ret{text-align:right}
  .arbcard .ret .roi{font-weight:800;font-size:30px;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums}
  .arbcard .ret .lab{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);margin-top:3px}
  .arbcard .ret .gtd{font-size:12px;font-weight:700;color:var(--teal);margin-top:6px;font-variant-numeric:tabular-nums}
  .vdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
  .arb-empty{padding:28px 20px;color:var(--txt-2);font-size:14px;font-weight:600;text-align:center}

  /* board */
  table.board{width:100%;border-collapse:collapse;font-size:14px}
  .board th{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3);text-align:right;padding:14px;border-bottom:1px solid var(--bdr)}
  .board th:first-child{text-align:left}
  .board td{padding:15px 14px;border-bottom:1px solid var(--line-soft);text-align:right;vertical-align:top;color:var(--txt);font-variant-numeric:tabular-nums}
  .board td:first-child{text-align:left}
  .board tbody tr{transition:background .12s}
  .board tbody tr:hover{background:rgba(255,255,255,.04)}
  .board .mt{font-weight:700;font-size:15px;color:var(--txt)}
  .board .mt .t{font-size:11px;color:var(--txt-3);font-weight:500;display:block;margin-top:2px}
  .sidecell .team{font-weight:800;font-size:13.5px;color:var(--txt);display:block;margin-bottom:5px}
  .sidecell .team em{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--txt-3);margin-left:6px;vertical-align:middle}
  .sidecell .fair{color:var(--txt-3);font-size:12px;font-weight:500}
  .sidecell .px{color:var(--txt);font-weight:700;font-size:15px;display:block;margin-top:3px}
  .sidecell .px.best{color:var(--teal)}
  .sidecell .ven{font-size:10.5px;color:var(--txt-3);display:block;margin-top:2px;font-weight:500}
  .sidecell .ev{font-size:11px;margin-top:3px;display:block;font-weight:700}
  .grow{cursor:pointer}
  .bestcell .team{font-weight:800;font-size:13.5px;color:var(--txt);display:block;margin-bottom:5px}
  .bestcell .team em{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--txt-3);margin-left:6px;vertical-align:middle}
  .bestcell .bestpx{color:var(--teal);font-weight:800;font-size:17px;display:block}
  .bestcell .acc{font-size:10.5px;font-weight:800;margin-left:7px;padding:1px 6px;border-radius:6px;vertical-align:middle}
  .acc.edge{color:var(--teal);background:rgba(52,217,192,.13)}
  .acc.lean{color:#E8C55A;background:rgba(232,197,90,.12)}
  .bestcell .ven{font-size:11px;color:var(--txt-2);display:block;margin-top:3px;font-weight:600}
  .bestcell .fair{font-size:11px;color:var(--txt-3);display:block;margin-top:2px;font-weight:500}
  .cmp{white-space:nowrap}
  .cmpbtn{font-size:11px;font-weight:700;color:var(--txt-3);border:1px solid var(--bdr-2);border-radius:8px;padding:6px 11px;display:inline-block}
  .grow:hover .cmpbtn{color:var(--txt);border-color:var(--txt-3)}
  @media (max-width:480px){
    .board th,.board td{padding:12px 8px}
    .cmpbtn{font-size:10px;padding:5px 8px}
  }
  .gm-modal{position:fixed;inset:0;background:rgba(5,6,8,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .gm-modal.on{display:flex}
  .gm-card{position:relative;width:min(520px,94vw);max-height:88vh;overflow:auto;background:#111318;border:1px solid var(--bdr);border-radius:18px;padding:26px 26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .gm-x{position:absolute;top:15px;right:17px;background:none;border:none;color:var(--txt-3);font-size:24px;line-height:1;cursor:pointer}
  .gm-x:hover{color:var(--txt)}
  .gm-h{font-size:19px;font-weight:800;color:var(--txt);padding-right:24px}
  .gm-t{font-size:12px;color:var(--txt-3);margin:3px 0 18px;font-weight:500}
  .gm-tab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .gm-tab th{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3);text-align:right;padding:9px 8px;border-bottom:1px solid var(--bdr)}
  .gm-tab th:first-child{text-align:left}
  .gm-tab td{padding:11px 8px;border-bottom:1px solid var(--line-soft);text-align:right;color:var(--txt)}
  .gm-tab td:first-child{text-align:left}
  .gm-tab .bk{font-weight:600}
  .gm-tab .bk .vdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
  .gm-tab .bx{color:var(--teal);font-weight:800}
  .gm-tab tr.susp td{color:var(--txt-3);opacity:.6}
  .gm-tab .sflag{font-style:normal;font-size:9px;color:var(--coral);border:1px solid rgba(255,92,92,.4);border-radius:5px;padding:1px 5px;margin-left:6px}
  .gm-tab .fairrow td{border-top:1px solid var(--bdr);border-bottom:none;font-weight:800;color:var(--txt-2);padding-top:13px}
  .gm-best{margin-top:16px;font-size:13px;color:var(--txt-2);font-weight:600;line-height:1.55}
  .gm-best b{color:var(--teal)}
  .ev.pos{color:var(--teal)}.ev.neg{color:var(--txt-3)}
  .badge{font-size:10.5px;font-weight:800;letter-spacing:.02em;border-radius:9px;padding:6px 11px;display:inline-block;white-space:nowrap}
  .badge.arb{color:#0A0A0C;background:var(--teal)}
  .badge.susp{color:var(--coral);border:1px solid rgba(255,92,92,.5);background:rgba(255,92,92,.1)}
  .badge.edge{color:var(--teal);border:1px solid rgba(52,217,192,.5);background:rgba(52,217,192,.1)}
  .badge.lean{color:#E8C55A;border:1px solid rgba(232,197,90,.55);background:rgba(232,197,90,.09)}
  .badge.flat{color:var(--txt-3);border:1px solid var(--bdr-2)}

  /* wave */
  .feed{display:flex;flex-direction:column}
  .move{display:flex;align-items:center;gap:14px;padding:15px 21px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .12s}
  .move:hover,.move.sel{background:rgba(255,255,255,.04)}
  .move .arrow{font-size:18px;font-weight:800;width:20px;text-align:center}
  .move .arrow.up{color:var(--teal)}.move .arrow.down{color:var(--coral)}
  .move .mk{flex:1;min-width:0}
  .move .mk .n{font-weight:700;font-size:14.5px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .move .mk .d{font-size:11px;color:var(--txt-3);font-weight:500;margin-top:2px}
  .move .cls{font-size:10px;font-weight:800;letter-spacing:.05em;padding:5px 9px;border-radius:8px;text-transform:uppercase}
  .cls.steam{color:#0A0A0C;background:var(--steam)}
  .cls.noise{color:var(--txt-3);border:1px solid var(--bdr-2)}
  .move .ago{font-size:11px;color:var(--txt-3);font-weight:500;width:48px;text-align:right;font-variant-numeric:tabular-nums}
  .wchart{padding:22px}
  .wstat{display:flex;gap:26px;margin-bottom:18px;flex-wrap:wrap}
  .wstat .s .l{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3)}
  .wstat .s .v{font-weight:800;font-size:24px;margin-top:5px;color:var(--txt);font-variant-numeric:tabular-nums}

  /* tail */
  table.tail{width:100%;border-collapse:collapse;font-size:14px}
  .tail th{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3);text-align:right;padding:14px;border-bottom:1px solid var(--bdr)}
  .tail th:first-child,.tail th:nth-child(2){text-align:left}
  .tail td{padding:14px;border-bottom:1px solid var(--line-soft);text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
  .tail td:nth-child(2){text-align:left}
  .tail tbody tr{cursor:pointer;transition:background .12s}
  .tail tbody tr:hover,.tail tbody tr.sel{background:rgba(255,255,255,.04)}
  .tail .rk{font-weight:800;font-size:16px;color:var(--txt-2);width:30px}
  .tail .wh{font-weight:700;font-size:14.5px;color:var(--txt);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tail td:nth-child(2){max-width:150px}
  @media (max-width:480px){ .tail .wh{max-width:92px} .tail td:nth-child(2){max-width:92px} }
  .tail .ad{font-size:11px;color:var(--txt-3);font-weight:500}
  .tail .pos{color:var(--teal);font-weight:800}.tail .neg{color:var(--coral);font-weight:800}
  .poslist{padding:6px 0}
  .posrow{display:flex;align-items:center;gap:12px;padding:13px 21px;border-bottom:1px solid var(--line-soft)}
  .posrow .s{flex:1}

//=================================================================

const VENUES = ['kalshi','poly','dk','fd','pin','mgm','czr'];
const VEN = {

};
const isExch = v => VEN[v].type==='exchange';

// today's slate. exchange prices in cents (implied %); book prices in american odds.
const games = [
  { id:'tex-hou', away:{n:'Rangers',ab:'TEX'}, home:{n:'Astros',ab:'HOU'}, time:'7:10 PM CT',

    v:{ kalshi:{away:57,home:44}, poly:{away:58,home:42}, dk:{away:-142,home:130}, fd:{away:-138,home:126}, pin:{away:-135,home:122} } },
  { id:'lad-sd',  away:{n:'Dodgers',ab:'LAD'}, home:{n:'Padres',ab:'SD'},  time:'9:40 PM PT',
    v:{ kalshi:{away:80,home:24}, poly:{away:64,home:38}, dk:{away:-175,home:150}, fd:{away:-170,home:145}, pin:{away:-178,home:152} } },
  { id:'atl-nym', away:{n:'Braves',ab:'ATL'},  home:{n:'Mets',ab:'NYM'},   time:'7:10 PM ET',

  { id:'sea-laa', away:{n:'Mariners',ab:'SEA'},home:{n:'Angels',ab:'LAA'}, time:'9:38 PM PT',
    v:{ kalshi:{away:49,home:53}, poly:{away:48,home:53}, dk:{away:104,home:-115}, fd:{away:108,home:-118}, pin:{away:102,home:-112} } },
];

// ---- odds math ----
const amDec = a => a>0 ? 1+a/100 : 1+100/Math.abs(a);
const cost  = (v,price)=> isExch(v) ? price/100 : 1/amDec(price);      // $ paid per $1 returned (implied prob incl. vig)
const pxLabel = (v,price)=> isExch(v) ? price+'¢' : (price>0?'+'+price:''+price);

// devig each two-sided venue, find consensus by median (robust to one bad book), flag outliers
function analyze(g){
  const rows = VENUES.filter(v=>g.v[v]).map(v=>{
    const ca=cost(v,g.v[v].away), ch=cost(v,g.v[v].home), tot=ca+ch;
    return { v, awFair:ca/tot, hmFair:ch/tot };
  });
  const sorted=[...rows].map(r=>r.awFair).sort((a,b)=>a-b);
  const med = sorted[Math.floor(sorted.length/2)];
  rows.forEach(r=> r.suspect = Math.abs(r.awFair-med) > .08);
  const clean = rows.filter(r=>!r.suspect);
  const fairAway = clean.reduce((s,r)=>s+r.awFair,0)/clean.length;
  const suspectV = rows.filter(r=>r.suspect).map(r=>r.v);
  return { rows, fairAway, fairHome:1-fairAway, suspectV };
}
// best (cheapest) price for a side, excluding suspect venues
function best(g, side, suspectV){
  let b=null;
  for(const v of VENUES){
    if(!g.v[v] || suspectV.includes(v)) continue;
    const c=cost(v, g.v[v][side]);
    if(!(c>0 && c<1)) continue;                 // ignore invalid/resolved prices (0¢/100¢)
    if(!b || c<b.cost) b={v, price:g.v[v][side], cost:c};
  }
  return b;
}
// TRUELINE: sharp-weighted, power-de-vigged "true" probability — a different, sharper
// number than the Board's flat median. Anchors on sharp sources; corrects fav-longshot bias.
const SHARP_W = { pin:3.0, kalshi:2.0, poly:2.0, dk:0.5, fd:0.5, mgm:0.5, czr:0.5 };
function devigPower(q1,q2){ let lo=0.3,hi=6; for(let i=0;i<44;i++){ const k=(lo+hi)/2; (Math.pow(q1,k)+Math.pow(q2,k)>1)?lo=k:hi=k; } const k=(lo+hi)/2; return [Math.pow(q1,k),Math.pow(q2,k)]; }
function trueLine(g, suspectV){ let wsum=0,pAway=0; for(const v of VENUES){ if(!g.v[v]||suspectV.includes(v)) continue; const [ta]=devigPower(cost(v,g.v[v].away),cost(v,g.v[v].home)); const w=SHARP_W[v]||0.5; pAway+=w*ta; wsum+=w; } if(!wsum) return null; const away=pAway/wsum; return { away, home:1-away }; }
function americanFromProb(p){ if(p<=0||p>=1) return ''; const dec=1/p; return dec>=2 ? '+'+Math.round((dec-1)*100) : '-'+Math.round(100/(dec-1)); }
// list of locked, risk-free arbs (best away + best home cost < $1), suspect prices excluded
function findArbs(){
  return games.map(g=>{
    const a=analyze(g);
    const ba=best(g,'away',a.suspectV), bh=best(g,'home',a.suspectV);
    const S=ba.cost+bh.cost;
    return { g, a, ba, bh, S, roi:(1-S)/S };
  }).filter(x=>x.S<1).sort((x,y)=>y.roi-x.roi);
}

function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
// build a movement series for a market: implied % over last ~6h, with one sharp move
function series(seed, start, end, jumpAt, jumpSize){
  const r=rng(seed), n=26, out=[]; let val=start;
  for(let i=0;i<n;i++){
    val += (r()-.5)*0.7;                       // noise
    if(i===jumpAt) val += jumpSize;            // the steam event
    val += (end-val)*(i/(n-1))*0.18;           // drift toward close
    out.push(Math.max(2,Math.min(98,val)));
  }
  out[n-1]=end;
  return out;
}

const TAIL_LB = 'https://data-api.polymarket.com/v1/leaderboard?category=SPORTS&timePeriod=ALL&orderBy=PNL&limit=40';
const tailPosUrl = (w,off) => `https://data-api.polymarket.com/positions?user=${w}&limit=500&offset=${off}&sortBy=CURRENT&sortDirection=DESC`;
async function tailGet(url, tries=4){           // retry politely on rate-limit (429)
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(url);
      if(r.status===429){ await new Promise(res=>setTimeout(res,700*(i+1))); continue; }
      return r.ok ? await r.json() : [];
    }catch(e){ if(i===tries-1) return []; await new Promise(res=>setTimeout(res,500)); }
  }
  return [];
}
async function tailAllPositions(w){             // paginate — whales hold hundreds of open bets
  const out=[]; const page=500;
  for(let off=0; off<2500; off+=page){
    const batch = await tailGet(tailPosUrl(w,off));
    if(!Array.isArray(batch) || !batch.length) break;
    out.push(...batch);
    if(batch.length < page) break;              // reached the last page
  }
  return out;
}
async function tailMapLimit(items, limit, fn){  // at most `limit` wallet-pulls running at once
  const out=new Array(items.length); let idx=0;
  const worker=async()=>{ while(idx<items.length){ const i=idx++; out[i]=await fn(items[i]); } };
  await Promise.all(Array.from({length:Math.min(limit,items.length)}, worker));
  return out;
}
const tailToday = () => new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const tailMoney = n => { const a=Math.abs(n); const s=a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e3?Math.round(a/1e3)+'k':String(Math.round(a)); return (n<0?'-':'+')+'$'+s; };
const tailSize = n => { const a=Math.abs(n||0); return '$'+(a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e3?(a/1e3).toFixed(1)+'k':a>=100?String(Math.round(a)):a.toFixed(2)); };
const tSlugDate = s => { const m=String(s||'').match(/(\d{4}-\d{2}-\d{2})/); return m?m[1]:null; };
function tIsLiveMlb(p){
  if(!p || typeof p.slug!=='string' || !p.slug.startsWith('mlb-')) return false;  // baseball only
  if(p.redeemable) return false;                          // settled -> skip
  if(p.curPrice===0 || p.curPrice===1) return false;      // only drop definitively-resolved markets
  const d=tSlugDate(p.slug); if(d && d<tailToday()) return false;   // game already past
  return true;
}

function truelineCalls(){
  return games.map(g=>{
    const a=analyze(g);
    const tl=trueLine(g,a.suspectV);
    if(!tl) return null;
    const ba=best(g,'away',a.suspectV), bh=best(g,'home',a.suspectV);
    const edgeA=(tl.away/ba.cost-1)*100, edgeH=(tl.home/bh.cost-1)*100;
    const pick = edgeA>=edgeH ? { team:g.away.ab, tp:tl.away, b:ba, edge:edgeA }
                              : { team:g.home.ab, tp:tl.home, b:bh, edge:edgeH };
    const conv = pick.edge>=3 ? 'play' : pick.edge>=1.5 ? 'lean' : 'pass';
    return { g, a, tl, pick, conv };
  }).filter(Boolean)
    .sort((x,y)=> (y.conv==='pass'?-999:y.pick.edge) - (x.conv==='pass'?-999:x.pick.edge));
}

let alphaStatus='idle', alphaTop=[], alphaPlayCount=0, alphaMatched=0, alphaErr='', alphaLoaded=false;
const AL_SEASON=String(new Date().getFullYear());
const AL_SHARE=0.61, AL_R=4.5, AL_N=15000, AL_HOME=0.15, AL_THRESH=0.03, AL_CAP=0.10;
// approximate run park factors by home team (static; refine later)
const PARK={'Colorado Rockies':1.14,'Cincinnati Reds':1.06,'Boston Red Sox':1.04,'Baltimore Orioles':1.03,'Kansas City Royals':1.02,'Texas Rangers':1.02,'Arizona Diamondbacks':1.02,'New York Yankees':1.02,'Philadelphia Phillies':1.01,'Chicago Cubs':1.01,'Atlanta Braves':1.01,'Los Angeles Angels':1.0,'Toronto Blue Jays':1.0,'Washington Nationals':1.0,'Minnesota Twins':1.0,'Houston Astros':1.0,'St. Louis Cardinals':1.0,'Chicago White Sox':1.0,'New York Mets':0.99,'Milwaukee Brewers':0.99,'Pittsburgh Pirates':0.99,'Los Angeles Dodgers':0.98,'Cleveland Guardians':0.98,'Tampa Bay Rays':0.98,'Athletics':0.98,'Detroit Tigers':0.97,'Miami Marlins':0.96,'San Diego Padres':0.94,'Seattle Mariners':0.94,'San Francisco Giants':0.93};
// engine
function alExpRuns(off,oppSt,oppPen,park,homeBump,lg){ const p=AL_SHARE*oppSt+(1-AL_SHARE)*oppPen; return lg*off*p*park+homeBump; }
function alRandn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function alGamma(k,th){ if(k<1) return alGamma(k+1,th)*Math.pow(Math.random(),1/k); const d=k-1/3,c=1/Math.sqrt(9*d); for(;;){ let x,v; do{x=alRandn();v=1+c*x;}while(v<=0); v=v*v*v; const u=Math.random(); if(u<1-0.0331*x*x*x*x)return d*v*th; if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v*th; } }
function alPois(l){ if(l<=0)return 0; if(l<30){ const L=Math.exp(-l); let k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; } return Math.max(0,Math.round(l+Math.sqrt(l)*alRandn())); }
function alSim(muH,muA){ let hw=0,tie=0; for(let i=0;i<AL_N;i++){ const rh=alPois(alGamma(AL_R,muH/AL_R)),ra=alPois(alGamma(AL_R,muA/AL_R)); if(rh>ra)hw++; else if(rh===ra)tie++; } return (hw+tie*muH/(muH+muA))/AL_N; }
function alKelly(p,dec){ const k=(p*dec-1)/(dec-1); return Math.max(0,Math.min(0.05,k*0.25)); }
async function alGet(u){ const r=await fetch(u); if(!r.ok) throw new Error('StatsAPI '+r.status); return r.json(); }
const alNorm=n=>String(n||'').toLowerCase().replace(/[^a-z]/g,'');

async function loadAlpha(){
  alphaStatus='loading'; renderAlpha();
  try{
    const date=slateOpts.length?slateOpts[Math.min(slateIdx,slateOpts.length-1)].date:etDate(new Date().toISOString());
    const base='https://statsapi.mlb.com/api/v1';
    const [sched,hit,pit]=await Promise.all([
      alGet(`${base}/schedule?sportId=1&date=${date}&hydrate=probablePitcher(stats(group=[pitching],type=[season],season=${AL_SEASON})),team`),
      alGet(`${base}/teams/stats?season=${AL_SEASON}&sportId=1&stats=season&group=hitting`),
      alGet(`${base}/teams/stats?season=${AL_SEASON}&sportId=1&stats=season&group=pitching`),
    ]);
    const teamRG={}, teamERA={}; let sRG=0,nRG=0,sERA=0,nERA=0;
    for(const s of (hit.stats?.[0]?.splits||[])){ const id=s.team?.id,gp=+s.stat?.gamesPlayed||0,r=+s.stat?.runs||0; if(id&&gp){ teamRG[id]=r/gp; sRG+=r/gp; nRG++; } }
    for(const s of (pit.stats?.[0]?.splits||[])){ const id=s.team?.id,e=+s.stat?.era||0; if(id&&e){ teamERA[id]=e; sERA+=e; nERA++; } }
    const lgRG=nRG?sRG/nRG:4.45, lgERA=nERA?sERA/nERA:4.20;
    const sgames={};
    for(const d of (sched.dates||[])) for(const gm of (d.games||[])){
      const h=gm.teams?.home,a=gm.teams?.away; if(!h?.team||!a?.team) continue;
      const stERA=pp=>{ const e=pp?.stats?.[0]?.splits?.[0]?.stat?.era; return e?+e:null; };
      sgames[alNorm(a.team.name)+'@'+alNorm(h.team.name)]={ homeId:h.team.id,awayId:a.team.id,
        homeStERA:stERA(h.probablePitcher),awayStERA:stERA(a.probablePitcher),
        homeSt:h.probablePitcher?.fullName||null,awaySt:a.probablePitcher?.fullName||null,
        park:PARK[h.team.name]??1.0 };
    }
    const out=[];
    for(const g of games){
      const sg=sgames[alNorm(g.away.n)+'@'+alNorm(g.home.n)]; if(!sg) continue;
      const a=analyze(g), tl=trueLine(g,a.suspectV); if(!tl) continue;
      const hOff=(teamRG[sg.homeId]||lgRG)/lgRG, aOff=(teamRG[sg.awayId]||lgRG)/lgRG;
      const hPen=(teamERA[sg.homeId]||lgERA)/lgERA, aPen=(teamERA[sg.awayId]||lgERA)/lgERA;
      const hSt=sg.homeStERA?sg.homeStERA/lgERA:hPen, aSt=sg.awayStERA?sg.awayStERA/lgERA:aPen;
      const missing=!sg.homeStERA||!sg.awayStERA;
      const muH=alExpRuns(hOff,aSt,aPen,sg.park,AL_HOME,lgRG), muA=alExpRuns(aOff,hSt,hPen,sg.park,0,lgRG);
      const pHome=alSim(muH,muA);
      const eHome=pHome-tl.home, eAway=(1-pHome)-tl.away;
      const homeBetter=eHome>=eAway, edge=homeBetter?eHome:eAway;
      if(edge<=0 || edge>AL_CAP) continue;                 // no value, or implausible (likely-stale) -> skip
      const which=homeBetter?'home':'away', b=best(g,which,a.suspectV);
      const p=homeBetter?pHome:1-pHome, mkt=homeBetter?tl.home:tl.away;
      const conv=(edge>=AL_THRESH && !missing)?'play':'lean';   // PLAY = real 3%+ edge, confirmed starter; else LEAN (watch)
      out.push({ g, team:homeBetter?g.home.ab:g.away.ab, p, mkt, edge, b, stake:alKelly(p,1/b.cost), conv });
    }
    out.sort((x,y)=>y.edge-x.edge);
    alphaMatched=out.length;
    alphaTop=out.slice(0,3);                                // always surface the day's top spots (never zero)
    alphaPlayCount=out.filter(x=>x.conv==='play').length;
    alphaStatus= alphaTop.length ? 'ready' : (Object.keys(sgames).length ? 'flat' : 'nomatch');
  }catch(e){ alphaStatus='error'; alphaErr=String(e&&e.message||e); }
  renderAlpha();
}

function alphaPlayCard(x){
  const play=x.conv==='play';
  return `<div class="pick">
    <div class="top"><div class="game">${x.g.away.ab} @ ${x.g.home.ab} · ${x.g.time}</div><div class="conv ${x.conv}">${play?'PLAY':'LEAN'}</div></div>
    <div class="call"><span>${x.team}</span> ${pxLabel(x.b.v,x.b.price)} · ${VEN[x.b.v].label}</div>
    <div class="lines">
      <div class="x"><div class="l">Model</div><div class="v">${(x.p*100).toFixed(0)}%</div></div>
      <div class="x"><div class="l">Market</div><div class="v">${(x.mkt*100).toFixed(0)}%</div></div>
      <div class="x"><div class="l">Edge</div><div class="v edge">+${(x.edge*100).toFixed(1)}%</div></div>
      ${play?`<div class="x"><div class="l">Bet size</div><div class="v">${(x.stake*100).toFixed(0)}%</div></div>`:''}
    </div>
    <div class="note">${play
      ? `Our model gives the ${x.team} about a ${(x.p*100).toFixed(0)}% chance to win — better than the ~${(x.mkt*100).toFixed(0)}% the market is giving them, and that gap is the value. Best price is ${pxLabel(x.b.v,x.b.price)} at ${VEN[x.b.v].label}. Suggested bet size: about ${(x.stake*100).toFixed(0)}% of your bankroll.`
      : `Our model leans ${x.team} here — about ${(x.p*100).toFixed(0)}% to win vs the market's ~${(x.mkt*100).toFixed(0)}%. It's a small edge, below our bet line, so treat it as one to watch rather than a play.`}</div>
  </div>`;
}

function renderAlpha(){
  const notice='';
  let body;
  if(alphaStatus==='loading'||alphaStatus==='idle') body=`<div class="panel"><div style="padding:40px 24px;text-align:center;color:var(--mut);line-height:1.6">Running the model on today's slate — pulling probable starters and season stats, then simulating every game…</div></div>`;
  else if(alphaStatus==='error') body=`<div class="panel"><div style="padding:34px 24px;color:var(--mut);line-height:1.6">Couldn't reach MLB StatsAPI from the browser (<span class="mono">${alphaErr}</span>). If it's a CORS block, the fix is a small proxy — same as we'd have done for Tail.</div></div>`;
  else if(alphaStatus==='nomatch') body=`<div class="panel"><div style="padding:34px 24px;color:var(--mut);line-height:1.6">Couldn't line up today's board games with MLB's schedule data (a team-name mismatch, most likely).</div></div>`;
  else if(alphaStatus==='flat') body=`<div class="panel"><div style="padding:34px 24px;text-align:center;color:var(--mut);line-height:1.6">Market's efficient across today's slate — our model doesn't see a spot worth flagging right now. Rare, but some nights the sharp line is just right. Worth another look closer to first pitch as lineups firm up.</div></div>`;
  else {
    const leans=alphaTop.length-alphaPlayCount;
    const head=`<div class="phead" style="border:0;padding:2px 2px 14px"><h3>Today's top spots</h3><div class="meta">${alphaPlayCount} play${alphaPlayCount===1?'':'s'} · ${leans} lean${leans===1?'':'s'} · ${alphaMatched} modeled</div></div>`;
    body=head+`<div class="picks">${alphaTop.map(alphaPlayCard).join('')}</div>`+`<div class="disc">PICK VAULT runs an independent MLB run-projection model (offense × opposing starter & bullpen × park, simulated ~${(AL_N/1000)}k times per game) and surfaces its top spots vs the sharp market line. A PLAY is a real 3%+ edge with a confirmed starter; a LEAN is a smaller edge we'd watch, not bet. Inputs are free public stats — the honest ceiling is that public data rarely beats a sharp close, so real edges stay small. Judge by CLV over a large sample, not any single night.</div>`;
  }
  document.getElementById('view-alpha').innerHTML=notice+body;
}

buildNav();
buildRail();
renderBoard(); renderWave(); renderTail(); renderTrueline(); renderAlpha();
route('board');

function buildRail(){
  const rail=document.createElement('nav');
  rail.className='mrail';
  document.querySelector('.mrail')?.remove();
  rail.innerHTML=PRODUCTS.map(p=>{ const locked=!tierAllows(p.id); return `<button class="railitem ${p.id===current?'on':''} ${p.soon||locked?'soon':''}" data-go="${p.id}"><span class="rico">${p.ico}</span><span class="rlbl">${p.nm.replace('The ','')}</span>${locked?'<span class="rsoon">\uD83D\uDD12</span>':(p.soon?'<span class="rsoon">SOON</span>':'')}</button>`; }).join('');
  document.body.appendChild(rail);
  rail.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>route(el.dataset.go)));
}

//=================================================================
//  LIVE DATA — read the poller's Supabase board, swap in for the demo slate
//=================================================================
const SB_URL  = 'https://qedwppnqudszajljyujd.supabase.co';
const SB_ANON = 'sb_publishable_WlC8l0sXhS_XD_rhcuUA_Q_BQEohYWQ';   // Supabase publishable key — safe in the browser
const SLUG2KEY = { pinnacle:'pin', draftkings:'dk', fanduel:'fd', kalshi:'kalshi', polymarket:'poly', betmgm:'mgm', caesars:'czr' };
const impliedCents = a => Math.round(100 / amDec(a));   // american -> exchange cents (implied %)
const NICK2 = ['Blue Jays','Red Sox','White Sox'];   // two-word nicknames
const nickname = full => { const s=(full||'').trim(); for(const n of NICK2) if(s.endsWith(n)) return n; return s.split(/\s+/).pop(); };
const etDate = iso => new Date(iso).toLocaleDateString('en-CA', { timeZone:'America/New_York' });   // YYYY-MM-DD in Eastern
const fmtWhen = iso => new Date(iso).toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short', timeZone:'America/New_York' });

async function sbGet(path){
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { headers:{ apikey:SB_ANON, Authorization:`Bearer ${SB_ANON}` } });
  if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
async function loadLive(){
  if(!SB_ANON || SB_ANON.indexOf('PASTE_')===0) return;          // not configured -> stay on demo
  try{
    const [meta, quotes] = await Promise.all([
      sbGet('mlb_games?select=id,away_team,home_team,commence'),
      sbGet('mlb_quotes?select=game_id,venue,away_price,home_price'),
    ]);
    const byId = new Map(meta.map(m=>[m.id, m]));
    const live = new Map();
    for(const q of quotes){
      const key = SLUG2KEY[q.venue]; if(!key) continue;          // only venues the board maps today
      const m = byId.get(q.game_id); if(!m) continue;
      let g = live.get(q.game_id);
      if(!g){
        g = { id:q.game_id, co:m.commence,
              away:{n:m.away_team, ab:nickname(m.away_team)},
              home:{n:m.home_team, ab:nickname(m.home_team)},
              time:fmtWhen(m.commence), v:{} };
        live.set(q.game_id, g);
      }
      if(isExch(key)){
        const aw=impliedCents(q.away_price), hm=impliedCents(q.home_price);
        if(aw>0 && aw<100 && hm>0 && hm<100) g.v[key]={ away:aw, home:hm };   // skip 0¢/100¢ (resolved/empty markets)
      } else if(q.away_price && q.home_price){
        g.v[key]={ away:q.away_price, home:q.home_price };
      }
    }
    // Build the full upcoming slate, then expose Today / Tomorrow as a toggle.
    const todayET = etDate(new Date().toISOString());
    const [ey,em,ed]=todayET.split('-').map(Number);
    const tdt=new Date(Date.UTC(ey,em-1,ed)); tdt.setUTCDate(tdt.getUTCDate()+1);
    const tomorrowET=tdt.toISOString().slice(0,10);
    allLive = [...live.values()]
      .filter(g=>Object.keys(g.v).length>=2)
      .filter(g=>new Date(g.co).getTime() > Date.now())
      .sort((a,b)=>new Date(a.co)-new Date(b.co));
    const present=new Set(allLive.map(g=>etDate(g.co)));
    slateOpts=[{date:todayET,label:'Today'},{date:tomorrowET,label:'Tomorrow'}].filter(o=>present.has(o.date));
    slateIdx=0;
    if(slateOpts.length){ applySlate(); console.log(`[BLUPRNT] live: ${allLive.length} games / ${slateOpts.length} day(s)`); }
    else console.warn('[BLUPRNT] no cross-venue games; staying on demo');
  }catch(e){ console.warn('[BLUPRNT] live load failed, staying on demo:', e.message); }
}
function applySlate(){
  if(!slateOpts.length) return;
  const day=slateOpts[Math.min(slateIdx,slateOpts.length-1)].date;
  const list=allLive.filter(g=>etDate(g.co)===day).slice(0,24);
  games.length=0; list.forEach(g=>games.push(g));
  renderBoard(); renderTrueline();
}
loadLive();
