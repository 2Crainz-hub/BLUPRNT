<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · BLUPRNT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0A0E1A;--panel:#111726;--txt:#E8ECF5;--txt-2:#A9B2C7;--txt-3:#6B7690;--teal:#34D9C0;--bdr:rgba(255,255,255,.1)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt-2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;padding:24px}
  .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--bdr);border-radius:18px;padding:34px 30px}
  .brand{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--teal);margin-bottom:18px}
  h1{color:var(--txt);font-size:22px;font-weight:800;margin:0 0 6px}
  .sub{font-size:14px;color:var(--txt-3);margin-bottom:24px;line-height:1.5}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--txt-2);margin:0 0 6px}
  input{width:100%;background:#0C111C;border:1px solid var(--bdr);border-radius:11px;padding:13px 14px;color:var(--txt);font-size:15px;margin-bottom:16px;outline:none}
  input:focus{border-color:var(--teal)}
  button{width:100%;background:var(--teal);color:#04120F;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
  button:hover{opacity:.92}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:13.5px;margin-top:16px;line-height:1.5;display:none}
  .msg.err{color:#ff7a7a;display:block}
  .msg.ok{color:var(--teal);display:block}
  a{color:var(--teal);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">BLUPRNT</div>
    <h1>Set a new password</h1>
    <div class="sub" id="sub">Enter a new password for your account.</div>
    <div id="form">
      <label>New password</label>
      <input type="password" id="pw1" placeholder="At least 8 characters" autocomplete="new-password">
      <label>Confirm password</label>
      <input type="password" id="pw2" placeholder="Re-enter password" autocomplete="new-password">
      <button id="save">Update password</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

<script>
  const SB_URL='https://qedwppnqudszajljyujd.supabase.co';
  const SB_ANON='sb_publishable_WlC8l0sXhS_XD_rhcuUA_Q_BQEohYWQ';
  const sb = window.supabase.createClient(SB_URL, SB_ANON);
  const msg=document.getElementById('msg'), form=document.getElementById('form'), sub=document.getElementById('sub');
  const show=(t,cls)=>{ msg.textContent=t; msg.className='msg '+cls; };

  // supabase-js auto-detects the recovery token in the URL and establishes a temporary session.
  let recoveryReady=false;
  sb.auth.onAuthStateChange((event)=>{ if(event==='PASSWORD_RECOVERY') recoveryReady=true; });

  document.getElementById('save').addEventListener('click', async ()=>{
    const p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
    if(p1.length<8){ show('Password must be at least 8 characters.','err'); return; }
    if(p1!==p2){ show("Passwords don't match.",'err'); return; }
    show('',''); const btn=document.getElementById('save'); btn.disabled=true; btn.textContent='Saving…';
    try{
      const { error } = await sb.auth.updateUser({ password: p1 });
      if(error) throw error;
      form.style.display='none'; sub.style.display='none';
      show('Password updated. Redirecting you to the app…','ok');
      setTimeout(()=>{ location.href='/app'; }, 1600);
    }catch(e){
      show((e.message||'Something went wrong.')+' This reset link may have expired — request a new one from the login page.','err');
      btn.disabled=false; btn.textContent='Update password';
    }
  });
</script>
</body>
</html>
